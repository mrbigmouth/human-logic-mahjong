# 策略側寫（Profile）範例。
# 結構已可解析；這些 id 對應的模組會在 M2（牌效）、M4（打點／防守／局勢）、M5（讀牌）陸續實作。
#
# 最終權重 = weight × 該層的局勢倍率（由 modifier 動態調整）
# curve：把原始值映射成效用值的分段線性曲線 [[x, y], ...]；省略時為恆等映射

name = "example"
description = "平衡型：牌效為主，有人立直時依局勢加重防守"

[[consideration]]
id = "efficiency.shanten"          # 向聽數下降（L2）
weight = 3.0

[[consideration]]
id = "efficiency.ukeire"           # 有效進張數（L2）
weight = 1.0
curve = [[0, 0], [20, 0.7], [40, 1.0]]

[[consideration]]
id = "value.expected_points"       # 期望打點（L3）
weight = 1.0
curve = [[0, 0], [8000, 1.0]]

[[consideration]]
id = "defense.deal_in_risk"        # 放銃率 × 對手打點（L4），值為負
weight = 2.0

[[modifier]]
id = "situation.all_last_behind"   # all last 落後時加重打點（L5）
params = { value_scale = 1.5, defense_scale = 0.5 }

[[modifier]]
id = "situation.big_lead"          # 大幅領先時加重防守（L5）
params = { lead = 12000, defense_scale = 1.8 }
