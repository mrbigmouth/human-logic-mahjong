[workspace]
resolver = "3"
members = ["crates/*"]
# 桌面 App（Tauri）是獨立的 workspace，見 app/src-tauri/Cargo.toml。
exclude = ["app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
mj-core = { path = "crates/mj-core" }
mj-rules = { path = "crates/mj-rules" }
mj-engine = { path = "crates/mj-engine" }
mj-calc = { path = "crates/mj-calc" }
mj-strategy = { path = "crates/mj-strategy" }
mj-sim = { path = "crates/mj-sim" }
mj-tuner = { path = "crates/mj-tuner" }
mj-review = { path = "crates/mj-review" }
mj-mjai = { path = "crates/mj-mjai" }
mj-paifu = { path = "crates/mj-paifu" }
mj-tools = { path = "crates/mj-tools" }
mj-app = { path = "crates/mj-app" }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
clap = { version = "4", features = ["derive"] }
rand = "0.9"
rand_chacha = "0.9"
serde_json = "1"
rayon = "1"
tiny_http = "0.12"

[profile.release]
lto = "thin"
codegen-units = 1

# fuzz 建置設定：release 的速度，但開啟除錯檢查（debug assertions），
# 引擎每回合都會檢查牌數與點數守恆。用於大量自我對戰的模糊測試。
[profile.fuzz]
inherits = "release"
debug-assertions = true
overflow-checks = true

# mj dev 用的建置設定（M16）：接近 release 的速度，但不做 LTO、開啟增量編譯，改策略後重建較快。
[profile.dev-fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
